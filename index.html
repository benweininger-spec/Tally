<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Qamar</title>
</head>
<body>
<title>Qamar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unica+One&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --ground:#0a0d18;
    --panel:rgba(15,18,32,.72);
    --panel-solid:#12162a;
    --line:#272e4a;
    --line-soft:#1c2238;
    --ink:#eae4d6;
    --dim:#8b90a5;
    --faint:#565b73;
    --amber:#efa94a;
    --amber-deep:#c77f2a;
    --teal:#52c8b8;
    --rose:#e06b8b;
    --display:'Unica One',system-ui,sans-serif;
    --body:'IBM Plex Sans',system-ui,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{color-scheme:dark}
  body{
    background:var(--ground);
    color:var(--ink);
    font-family:var(--body);
    font-size:14px;
    line-height:1.45;
    min-height:100vh;
    overflow-x:hidden;
  }
  #viz{position:fixed;inset:0;z-index:0;display:block}
  .app{position:relative;z-index:1;max-width:1480px;margin:0 auto;padding:14px;display:flex;flex-direction:column;gap:12px;min-height:100vh}
  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
  }

  /* ---------- header ---------- */
  header.panel{display:flex;align-items:center;gap:20px;padding:10px 18px;flex-wrap:wrap}
  .wordmark{font-family:var(--display);font-size:30px;letter-spacing:.14em;color:var(--ink);line-height:1;display:flex;flex-direction:column}
  .wordmark small{font-family:var(--mono);font-size:9px;letter-spacing:.32em;color:var(--amber);text-transform:uppercase;margin-top:2px}
  .play{
    width:52px;height:52px;border-radius:50%;border:1px solid var(--amber-deep);
    background:radial-gradient(circle at 35% 30%, #f7c67c, var(--amber) 55%, var(--amber-deep));
    color:#20150a;font-size:18px;cursor:pointer;flex:none;
    box-shadow:0 0 0 4px rgba(239,169,74,.12), 0 4px 18px rgba(239,169,74,.25);
    display:flex;align-items:center;justify-content:center;
  }
  .play.on{background:radial-gradient(circle at 35% 30%, #ffe2b0, #f5b95f 55%, var(--amber));box-shadow:0 0 0 4px rgba(239,169,74,.28),0 4px 26px rgba(239,169,74,.5)}
  .hdr-group{display:flex;align-items:center;gap:10px}
  .scenes{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
  .scene-btn{
    font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    background:transparent;border:1px solid var(--line);color:var(--dim);
    border-radius:8px;padding:8px 12px;cursor:pointer;
  }
  .scene-btn:hover{border-color:var(--amber-deep);color:var(--ink)}
  .scene-btn.ghost{border-style:dashed}

  /* ---------- columns ---------- */
  .cols{display:grid;grid-template-columns:280px minmax(0,1fr) 300px;gap:12px;align-items:start;flex:1}
  @media (max-width:1180px){.cols{grid-template-columns:250px minmax(0,1fr)} #sound{grid-column:1 / -1}}
  @media (max-width:840px){.cols{grid-template-columns:1fr} #sound{grid-column:auto}}
  .side{padding:16px;display:flex;flex-direction:column;gap:14px}

  h2{font-family:var(--display);font-size:15px;letter-spacing:.22em;color:var(--dim);font-weight:400;text-transform:uppercase}
  .field label{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:var(--faint);margin-bottom:5px}
  select,input[type="number"]{
    width:100%;background:var(--panel-solid);color:var(--ink);
    border:1px solid var(--line);border-radius:8px;padding:7px 9px;
    font-family:var(--mono);font-size:12px;
  }
  select:focus-visible,button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  .blurb{font-size:12.5px;color:var(--dim);border-left:2px solid var(--amber-deep);padding-left:10px}
  .blurb b{color:var(--ink);font-weight:600}
  .notes-row{display:flex;flex-wrap:wrap;gap:5px}
  .note-chip{font-family:var(--mono);font-size:10.5px;padding:3px 7px;border-radius:6px;border:1px solid var(--line);color:var(--ink)}

  /* ---------- racks ---------- */
  #racks{display:flex;flex-direction:column;gap:12px;min-width:0}
  .rack{padding:12px 14px 14px}
  .rack-head{display:flex;align-items:baseline;gap:12px;margin-bottom:10px;flex-wrap:wrap}
  .rack-title{
    font-family:var(--display);font-size:16px;letter-spacing:.18em;text-transform:uppercase;
    background:none;border:none;color:var(--dim);cursor:pointer;padding:2px 4px;border-radius:6px;
  }
  .rack-title:hover{color:var(--ink)}
  .rack.sel .rack-title{color:var(--amber)}
  .rack.sel{border-color:rgba(239,169,74,.55)}
  .rack-note{font-family:var(--mono);font-size:10px;color:var(--faint);letter-spacing:.06em}
  .mini-btn{
    font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
    background:transparent;border:1px solid var(--line);color:var(--dim);border-radius:6px;
    padding:4px 8px;cursor:pointer;
  }
  .mini-btn.on{border-color:var(--teal);color:var(--teal)}
  .drum-grid{display:grid;grid-template-columns:64px repeat(16,minmax(14px,1fr));gap:4px;align-items:center}
  .drum-label{font-family:var(--mono);font-size:10.5px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
  .cell{
    height:26px;border-radius:5px;border:1px solid var(--line-soft);
    background:rgba(255,255,255,.025);cursor:pointer;padding:0;
  }
  .cell.beat{border-color:var(--line)}
  .cell.on{background:var(--amber);border-color:var(--amber);box-shadow:0 0 10px rgba(239,169,74,.45)}
  .cell.ph{outline:1px solid rgba(234,228,214,.75);outline-offset:1px}
  .mel-grid{display:grid;gap:3px;align-items:center}
  .mel-grid .cell{height:15px}
  .row-label{font-family:var(--mono);font-size:9px;color:var(--faint);text-align:right;padding-right:6px;white-space:nowrap}
  .chord-cells{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .chord-cell{
    border:1px solid var(--line);border-radius:8px;padding:8px 10px;text-align:center;
  }
  .chord-cell.now{border-color:var(--amber);box-shadow:0 0 14px rgba(239,169,74,.18) inset}
  .chord-cell .rn{font-family:var(--display);font-size:18px;letter-spacing:.1em;color:var(--ink)}
  .chord-cell .cn{font-family:var(--mono);font-size:9.5px;color:var(--dim);margin-top:2px}
  .style-btns{display:flex;gap:6px}

  /* ---------- knobs ---------- */
  .knobs{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:10px 6px}
  .knob{display:flex;flex-direction:column;align-items:center;gap:2px;user-select:none;touch-action:none;cursor:ns-resize}
  .knob svg{display:block}
  .knob .k-track{stroke:var(--line);fill:none;stroke-width:3;stroke-linecap:round}
  .knob .k-val{stroke:var(--amber);fill:none;stroke-width:3;stroke-linecap:round}
  .knob .k-dot{fill:var(--ink)}
  .knob .k-name{font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
  .knob .k-out{font-family:var(--mono);font-size:10px;color:var(--ink)}
  .knob.teal .k-val{stroke:var(--teal)}
  .divider{border-top:1px solid var(--line-soft)}

  /* ---------- pads ---------- */
  #padsPanel{padding:12px 16px 16px}
  .pads{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .pad{
    flex:1 1 52px;min-width:48px;height:64px;border-radius:9px;cursor:pointer;
    border:1px solid var(--line);background:rgba(255,255,255,.03);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  }
  .pad .pn{font-family:var(--mono);font-size:12px;color:var(--ink)}
  .pad .pk{font-family:var(--mono);font-size:9px;color:var(--faint);border:1px solid var(--line-soft);border-radius:4px;padding:0 4px}
  .pad.lit{background:rgba(239,169,74,.22)}
  footer{font-family:var(--mono);font-size:10px;color:var(--faint);text-align:center;padding:4px 0 10px;letter-spacing:.08em}

  /* ---------- XY macro pads ---------- */
  .xy{position:relative;height:130px;border-radius:10px;border:1px solid var(--line);cursor:crosshair;touch-action:none;overflow:hidden;
    background:linear-gradient(105deg,rgba(20,14,40,.9),rgba(60,30,80,.45) 60%,rgba(140,70,60,.35)),var(--panel-solid)}
  .xy::after{content:'';position:absolute;inset:0;background:
    repeating-linear-gradient(0deg,transparent 0 24px,rgba(255,255,255,.035) 24px 25px),
    repeating-linear-gradient(90deg,transparent 0 24px,rgba(255,255,255,.035) 24px 25px)}
  .xy-dot{position:absolute;width:18px;height:18px;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:1;
    background:radial-gradient(circle at 35% 30%,#ffe6bd,var(--amber));box-shadow:0 0 14px rgba(239,169,74,.8)}
  .xy-lab{position:absolute;font-family:var(--mono);font-size:8px;letter-spacing:.18em;text-transform:uppercase;color:rgba(234,228,214,.5);pointer-events:none;z-index:1}
  .xy-lab.l{left:8px;bottom:6px}.xy-lab.r{right:8px;bottom:6px}.xy-lab.t{left:8px;top:6px}

  details.fine{border:1px solid var(--line-soft);border-radius:9px;padding:8px 10px}
  details.fine summary{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);cursor:pointer;list-style:none}
  details.fine summary::before{content:'+ '}
  details.fine[open] summary::before{content:'\2212  '}
  details.fine .knobs{margin-top:10px}
  .hint{font-size:12px;color:var(--dim);font-style:italic}
  .build-btn{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;
    background:rgba(82,200,184,.08);border:1px solid rgba(82,200,184,.5);color:var(--teal);border-radius:8px;padding:8px 10px;width:100%}
  .build-btn:hover{background:rgba(82,200,184,.16)}

  /* ---------- immersed scene mode ---------- */
  body.immersed .app>*{opacity:0;pointer-events:none;transition:opacity .8s}
  #exitScene{display:none;position:fixed;z-index:5;left:50%;bottom:26px;transform:translateX(-50%);
    font-family:var(--mono);font-size:10px;letter-spacing:.24em;text-transform:uppercase;
    background:rgba(10,13,24,.55);border:1px solid var(--line);color:var(--dim);border-radius:999px;padding:10px 20px;cursor:pointer;backdrop-filter:blur(8px)}
  body.immersed #exitScene{display:block}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<canvas id="viz" aria-hidden="true"></canvas>
<button id="exitScene">back to the desk</button>
<div class="app">
  <header class="panel">
    <div class="wordmark">QAMAR<small>night studio</small></div>
    <button class="play" id="playBtn" aria-label="Play or stop">&#9654;</button>
    <div class="hdr-group" id="hdrKnobs"></div>
    <div class="scenes" id="scenes"></div>
  </header>
  <div class="cols">
    <aside class="panel side" id="theory"></aside>
    <section id="racks"></section>
    <aside class="panel side" id="sound"></aside>
  </div>
  <div class="panel" id="padsPanel"></div>
  <footer>QAMAR &middot; browser synthesis, nothing recorded, nothing sent anywhere &middot; patterns save locally</footer>
</div>

<script>
'use strict';
/* =============================== theory =============================== */
const SCALES=[
 {id:'major',name:'Major (Ionian)',c:[0,200,400,500,700,900,1100],blurb:'Bright and settled. The home scale of most Western pop; every note agrees with the key.'},
 {id:'minor',name:'Natural Minor',c:[0,200,300,500,700,800,1000],blurb:'Darker and inward. The same notes as its relative major, started from a different home.'},
 {id:'dorian',name:'Dorian',c:[0,200,300,500,700,900,1000],blurb:'Minor with a raised 6th. The workhorse of deep house and funk: moody, but never sad.'},
 {id:'phrygian',name:'Phrygian',c:[0,100,300,500,700,800,1000],blurb:'Minor with a flat 2nd sitting one step above the root. Instant tension; common in flamenco.'},
 {id:'mixo',name:'Mixolydian',c:[0,200,400,500,700,900,1000],blurb:'Major with a flat 7th. Loose and bluesy; the sound of rock and funk vamps.'},
 {id:'harmmin',name:'Harmonic Minor',c:[0,200,300,500,700,800,1100],blurb:'Minor with a raised 7th, leaving a wide, dramatic step between the 6th and 7th.'},
 {id:'majpent',name:'Major Pentatonic',c:[0,200,400,700,900],blurb:'Five notes and no tension. Almost any combination sounds calm; ideal for study music.'},
 {id:'minpent',name:'Minor Pentatonic',c:[0,300,500,700,1000],blurb:'Five notes, the backbone of blues. Safe everywhere over a minor groove.'},
 {id:'hijaz',name:'Maqam Hijaz',c:[0,100,400,500,700,800,1000],blurb:'The signature Arabic sound: a flat 2nd against a major 3rd makes one wide, yearning step.'},
 {id:'rast',name:'Maqam Rast',c:[0,200,350,500,700,900,1050],blurb:'The cornerstone maqam. Its 3rd and 7th sit a quarter tone low, between major and minor. A piano cannot play it; a synthesizer can.'},
 {id:'bayati',name:'Maqam Bayati',c:[0,150,300,500,700,800,1000],blurb:'Gentle and warm, with a half-flat 2nd. One of the most sung maqamat in Arabic music.'},
 {id:'saba',name:'Maqam Saba',c:[0,150,300,400,700,800,1000],blurb:'Aching and unstable; its lowered 4th pulls every phrase downward. Deeply expressive.'}
];
const PROGS=[
 {id:'house',name:'i · VI · III · VII',deg:[0,5,2,6],blurb:'The melodic house loop. Four minor-key chords that circle without ever landing hard.'},
 {id:'pop',name:'I · V · vi · IV',deg:[0,4,5,3],blurb:'The pop axis. Bright start, minor dip, hopeful return. Thousands of songs live here.'},
 {id:'jazz',name:'ii · V · I · vi',deg:[1,4,0,5],blurb:'A jazz turnaround. The pull from ii to V to I is the strongest resolution in Western harmony.'},
 {id:'andalusian',name:'i · VII · VI · V',deg:[0,6,5,4],blurb:'The Andalusian descent: a stepwise walk down to the 5th. Flamenco and surf both live here.'},
 {id:'vamp',name:'i · iv · i · v',deg:[0,3,0,4],blurb:'A slow minor vamp. Two chords rocking back and forth, leaving all the room to melody.'},
 {id:'drone',name:'Root drone',deg:[0,0,0,0],drone:true,blurb:'No changes at all. Maqam music traditionally unfolds over a drone; the melody carries everything.'}
];
const ROMAN=['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'];
const NAMES=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
const ROOTS=[{n:'C',m:36},{n:'D♭',m:37},{n:'D',m:38},{n:'E♭',m:39},{n:'E',m:40},{n:'F',m:41},{n:'G♭',m:30},{n:'G',m:31},{n:'A♭',m:32},{n:'A',m:33},{n:'B♭',m:34},{n:'B',m:35}];
const scaleById=id=>SCALES.find(s=>s.id===id)||SCALES[2];
const progById=id=>PROGS.find(p=>p.id===id)||PROGS[0];
function noteName(midi,cents){
  const total=midi*100+cents;
  const semis=Math.round(total/100), rem=Math.round(total-semis*100);
  let n=NAMES[((semis%12)+12)%12];
  if(rem<=-30)n+='½♭'; else if(rem>=30)n+='½♯';
  return n;
}
function hueFor(cents){ return (((cents%1200)+1200)%1200)*0.3; } // root=red, wraps once per octave
function scaleRowCents(scale,row){ const L=scale.c.length; return scale.c[row%L]+1200*Math.floor(row/L); }
function chordCents(scale,deg){ // stacked scale thirds
  const L=scale.c.length, out=[];
  for(const k of [0,2,4]){ const i=deg+k; out.push(scale.c[i%L]+1200*Math.floor(i/L)); }
  return out;
}
function chordNumeral(scale,deg){
  const c=chordCents(scale,deg), third=c[1]-c[0];
  const rn=ROMAN[deg]||String(deg+1);
  return third<350?rn.toLowerCase():rn;
}

/* =============================== patches =============================== */
const PATCHES={
 sub:  {name:'Deep Sub',   wave:'sine',    sub:1,det:0,voices:1,noise:0,partial:0,penv:0,cut:750, res:2, att:.004,rel:.22,fenv:250, fdec:.14,lfoRate:0,  lfoDepth:0, lfoTgt:'filter'},
 acid: {name:'Acid Pluck', wave:'sawtooth',sub:0,det:0,voices:1,noise:0,partial:0,penv:0,cut:520, res:10,att:.003,rel:.14,fenv:2600,fdec:.16,lfoRate:0,  lfoDepth:0, lfoTgt:'filter'},
 pad:  {name:'Warm Pad',   wave:'sawtooth',sub:0,det:11,voices:2,noise:0,partial:0,penv:0,cut:1250,res:1, att:.55, rel:1.4,fenv:350, fdec:.9, lfoRate:.35,lfoDepth:9, lfoTgt:'pitch'},
 keys: {name:'Glass Keys', wave:'triangle',sub:0,det:4, voices:2,noise:0,partial:2, penv:0,cut:2400,res:2, att:.004,rel:.5, fenv:900, fdec:.22,lfoRate:0,  lfoDepth:0, lfoTgt:'filter'},
 oud:  {name:'Oud Pluck',  wave:'sawtooth',sub:0,det:6, voices:2,noise:.06,partial:0,penv:1,cut:1700,res:4, att:.002,rel:.4, fenv:1600,fdec:.07,lfoRate:0,  lfoDepth:0, lfoTgt:'filter'},
 ney:  {name:'Ney Breath', wave:'sine',    sub:0,det:0, voices:1,noise:.18,partial:0,penv:0,cut:1900,res:1, att:.22, rel:.8, fenv:0,   fdec:.3, lfoRate:5,  lfoDepth:14,lfoTgt:'pitch'},
 bell: {name:'Night Bell', wave:'sine',    sub:0,det:0, voices:1,noise:0,partial:3.98,penv:0,cut:5200,res:.7,att:.002,rel:1.1,fenv:0,  fdec:.3, lfoRate:0,  lfoDepth:0, lfoTgt:'filter'},
 horn: {name:'Rhaita Horn',wave:'sawtooth',sub:0,det:9, voices:2,noise:.05,partial:0,penv:1,cut:1500,res:7, att:.05, rel:.3, fenv:500, fdec:.12,lfoRate:5.5,lfoDepth:11,lfoTgt:'pitch'},
 strings:{name:'Dusk Strings',wave:'sawtooth',sub:0,det:14,voices:2,noise:.03,partial:0,penv:0,cut:2100,res:.6,att:.4,rel:1.8,fenv:250,fdec:.9,lfoRate:.3,lfoDepth:6,lfoTgt:'pitch'}
};
const COMPANIONS={
 sub:    {hint:'Foundation. Glass stabs on top and a dorian minor loop around it.',
          scaleId:'dorian',progId:'house',tracks:{chords:{patch:'keys',style:'stab'},lead:{patch:'bell'}}},
 acid:   {hint:'A squelchy line that wants four on the floor and glass stabs above.',
          scaleId:'dorian',progId:'house',tracks:{chords:{patch:'keys',style:'stab'},bass:{patch:'sub'}}},
 pad:    {hint:'A slow bed. Bells drifting above, a soft sub underneath.',
          progId:'vamp',tracks:{lead:{patch:'bell'},bass:{patch:'sub',follow:true}}},
 keys:   {hint:'Stab material. Deep sub below and a jazz turnaround behind it.',
          progId:'jazz',tracks:{bass:{patch:'sub',follow:true},lead:{patch:'bell'}}},
 oud:    {hint:'Plucked strings love space. Bayati over a drone, breathy ney behind.',
          scaleId:'bayati',progId:'drone',tracks:{chords:{patch:'ney',style:'pad'},bass:{patch:'sub',follow:false}}},
 ney:    {hint:'Breath and air. A drone, an oud answering, a low root held long.',
          scaleId:'bayati',progId:'drone',tracks:{lead:{patch:'oud'},bass:{patch:'sub',follow:false}}},
 bell:   {hint:'Bells carry study music. Pentatonic, a slow vamp, a warm pad.',
          scaleId:'majpent',progId:'vamp',tracks:{chords:{patch:'pad',style:'pad'},bass:{patch:'sub',follow:true}}},
 horn:   {hint:'A reedy double-reed call. Try dusk strings droning in Hijaz beneath it.',
          scaleId:'hijaz',progId:'drone',tracks:{chords:{patch:'strings',style:'pad'},bass:{patch:'sub',follow:false}}},
 strings:{hint:'An ensemble bed. A horn lead above, harmonic minor for drama.',
          scaleId:'harmmin',progId:'andalusian',tracks:{lead:{patch:'horn'},bass:{patch:'sub',follow:true}}}
};
const MEL_KNOBS=[
 {k:'cut', n:'cutoff',min:80,max:9000,exp:1,fmt:v=>v>=1000?(v/1000).toFixed(1)+'k':Math.round(v)},
 {k:'res', n:'reso',  min:0,max:18,fmt:v=>v.toFixed(1)},
 {k:'att', n:'attack',min:.001,max:1.2,exp:1,fmt:v=>Math.round(v*1000)+'ms'},
 {k:'rel', n:'release',min:.03,max:3,exp:1,fmt:v=>v.toFixed(2)+'s'},
 {k:'fenv',n:'flt env',min:0,max:4500,fmt:v=>Math.round(v)},
 {k:'lfoRate',n:'lfo rate',min:0,max:12,fmt:v=>v.toFixed(1)},
 {k:'lfoDepth',n:'lfo amt',min:0,max:60,fmt:v=>Math.round(v)},
 {k:'dly', n:'delay', min:0,max:1,fmt:v=>Math.round(v*100)+'%'},
 {k:'rev', n:'reverb',min:0,max:1,fmt:v=>Math.round(v*100)+'%'},
 {k:'vol', n:'level', min:0,max:1,fmt:v=>Math.round(v*100)+'%'}
];
const DRUM_META={
 kick:{label:'Kick', p1:{n:'tune',min:.5,max:1.6},p2:{n:'decay',min:.1,max:1}},
 clap:{label:'Clap', p1:{n:'tone',min:.2,max:1.6},p2:{n:'decay',min:.1,max:1}},
 hat: {label:'Hat',  p1:{n:'decay',min:.05,max:1},p2:{n:'tone',min:.3,max:1.5}},
 perc:{label:'Perc', p1:{n:'tune',min:.4,max:2},  p2:{n:'decay',min:.1,max:1}}
};

/* =============================== state =============================== */
function melTrack(patch,oct,over={}){
  return Object.assign({steps:Array(16).fill(-1),patch,oct,follow:false,glide:0,dly:.15,rev:.15,vol:.7},
    JSON.parse(JSON.stringify(PATCHES[patch])),over);
}

/* ---- macro system: few controls, many parameters ---- */
const clamp01=v=>Math.min(1,Math.max(0,v));
function applyCharacter(tr){ // XY pad: x dark->bright, y soft->plucky
  const x=tr.macroX, y=tr.macroY;
  tr.cut=150*Math.pow(8000/150,Math.pow(x,1.15));
  tr.att=.42*(1-y)+.003*y;
  tr.rel=2.3*(1-y)+.14*y;
  tr.fenv=2600*y;
  tr.fdec=.6-.5*y;
  tr.res=1+6.5*y;
}
function applyMotion(tr){ const v=tr.motion;
  tr.lfoRate=v<.02?0:.3+8*Math.pow(v,1.4);
  tr.lfoDepth=v<.02?0:48*Math.pow(v,1.2);
}
function applySpace(tr){ tr.dly=.65*tr.space; tr.rev=.85*tr.space; }
function macrosFromParams(tr){ // best-effort inverse so pads land where the patch is
  tr.macroX=clamp01(Math.pow(Math.log(Math.max(tr.cut,150)/150)/Math.log(8000/150),1/1.15));
  tr.macroY=clamp01((.42-tr.att)/(.42-.003));
  tr.motion=clamp01(Math.pow(tr.lfoDepth/48,1/1.2));
  tr.space=clamp01((tr.dly/.65+tr.rev/.85)/2);
}
function normalize(s){
  if(s.atmoX==null)s.atmoX=.4;
  if(s.atmoY==null)s.atmoY=.5;
  if(s.evolve==null)s.evolve=false;
  for(const id of ['bass','chords','lead']){ const t=s.tr[id];
    if(t.macroX==null)macrosFromParams(t); }
  return s;
}

/* =============================== audio engine =============================== */
let ac=null, master, drive, comp, analyser, dlyIn, dly, dlyFb, dlyFlt, dlyRet, revIn, rev, revRet;
function makeImpulse(){
  const len=Math.floor(ac.sampleRate*2.6), buf=ac.createBuffer(2,len,ac.sampleRate);
  for(let ch=0;ch<2;ch++){ const d=buf.getChannelData(ch);
    for(let i=0;i<len;i++){ d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6); } }
  return buf;
}
function driveCurve(amt){
  // blend dry signal with soft tanh saturation so low settings stay clean
  const k=1+amt*6, n=1024, c=new Float32Array(n);
  for(let i=0;i<n;i++){ const x=i/(n-1)*2-1; c[i]=x*(1-amt)+amt*Math.tanh(k*x)/Math.tanh(k); }
  return c;
}
function delaySeconds(){
  const spb=60/st.bpm;
  return ({'1/8':.5,'3/16':.75,'1/4':1}[st.delayDiv]||.75)*spb;
}
let unlockEl=null;
function unlockMedia(){
  // iOS routes Web Audio through the "ambient" session, which the ring/silent
  // switch mutes; a playing media element promotes it to "playback".
  if(unlockEl)return;
  try{
    unlockEl=document.createElement('audio');
    unlockEl.setAttribute('playsinline','');
    unlockEl.loop=true; unlockEl.volume=0.001;
    unlockEl.src='data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAAAAAAA';
    const p=unlockEl.play(); if(p&&p.catch)p.catch(()=>{});
  }catch(e){}
}
function ensureAudio(){
  unlockMedia();
  if(ac){ if(ac.state!=='running')ac.resume(); return; }
  const AC=window.AudioContext||window.webkitAudioContext;
  ac=new AC();
  if(ac.state!=='running')ac.resume();
  master=ac.createGain(); master.gain.value=st.master;
  drive=ac.createWaveShaper(); drive.curve=driveCurve(st.drive); drive.oversample='2x';
  comp=ac.createDynamicsCompressor();
  comp.threshold.value=-16; comp.ratio.value=4; comp.attack.value=.004; comp.release.value=.24;
  analyser=ac.createAnalyser(); analyser.fftSize=2048;
  master.connect(drive); drive.connect(comp); comp.connect(analyser); analyser.connect(ac.destination);
  dlyIn=ac.createGain(); dly=ac.createDelay(2); dly.delayTime.value=delaySeconds();
  dlyFlt=ac.createBiquadFilter(); dlyFlt.type='lowpass'; dlyFlt.frequency.value=2600;
  dlyFb=ac.createGain(); dlyFb.gain.value=st.delayFb;
  dlyRet=ac.createGain(); dlyRet.gain.value=.9;
  dlyIn.connect(dly); dly.connect(dlyFlt); dlyFlt.connect(dlyFb); dlyFb.connect(dly);
  dlyFlt.connect(dlyRet); dlyRet.connect(master);
  revIn=ac.createGain(); rev=ac.createConvolver(); rev.buffer=makeImpulse();
  revRet=ac.createGain(); revRet.gain.value=st.revAmt;
  revIn.connect(rev); rev.connect(revRet); revRet.connect(master);
}
function rootFreq(){ return 440*Math.pow(2,(st.rootMidi-69)/12); }
function centsToFreq(cents,oct){ return rootFreq()*Math.pow(2,(cents+1200*oct)/1200); }

function playMel(tr,cents,oct,t,dur,vel,fromFreq){
  ensureAudio();
  const f=centsToFreq(cents,oct);
  const vca=ac.createGain(); vca.gain.value=0;
  const flt=ac.createBiquadFilter(); flt.type='lowpass'; flt.Q.value=tr.res;
  const out=ac.createGain(); out.gain.value=tr.vol*vel;
  flt.connect(vca); vca.connect(out); out.connect(master);
  const sendMul=.35+st.atmoX*1.4;
  if(tr.dly>0){ const s=ac.createGain(); s.gain.value=Math.min(1,tr.dly*sendMul); out.connect(s); s.connect(dlyIn); }
  if(tr.rev>0){ const s=ac.createGain(); s.gain.value=Math.min(1,tr.rev*sendMul); out.connect(s); s.connect(revIn); }
  const att=Math.max(.002,tr.att), rel=Math.max(.03,tr.rel);
  const stopAt=t+dur+rel*2.5+.1;
  const oscs=[];
  const nv=Math.max(1,tr.voices|0);
  for(let i=0;i<nv;i++){
    const o=ac.createOscillator(); o.type=tr.wave;
    const detune=nv>1?(i===0?-tr.det:tr.det):0;
    if(tr.glide>0&&fromFreq&&fromFreq!==f){ o.frequency.setValueAtTime(fromFreq,t); o.frequency.exponentialRampToValueAtTime(f,t+tr.glide); }
    else o.frequency.setValueAtTime(f,t);
    o.detune.setValueAtTime(detune,t);
    if(tr.penv){ o.detune.setValueAtTime(detune+45,t); o.detune.linearRampToValueAtTime(detune,t+.06); }
    const g=ac.createGain(); g.gain.value=1/nv;
    o.connect(g); g.connect(flt); o.start(t); o.stop(stopAt); oscs.push(o);
  }
  if(tr.sub){ const o=ac.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(f/2,t);
    const g=ac.createGain(); g.gain.value=.6; o.connect(g); g.connect(flt); o.start(t); o.stop(stopAt); oscs.push(o); }
  if(tr.partial){ const o=ac.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(f*tr.partial,t);
    const g=ac.createGain(); g.gain.setValueAtTime(.33,t); g.gain.setTargetAtTime(0,t+.01,.12);
    o.connect(g); g.connect(flt); o.start(t); o.stop(stopAt); oscs.push(o); }
  if(tr.noise>0){ const nb=ac.createBuffer(1,ac.sampleRate*.5,ac.sampleRate); const d=nb.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    const src=ac.createBufferSource(); src.buffer=nb; src.loop=true;
    const g=ac.createGain(); g.gain.value=tr.noise; src.connect(g); g.connect(flt); src.start(t); src.stop(stopAt); oscs.push(src); }
  // filter envelope; the atmosphere pad's neon axis brightens or darkens every voice
  const base=Math.min(Math.max(tr.cut*Math.pow(3,(st.atmoY-.5)*2),60),12000);
  flt.frequency.setValueAtTime(Math.min(base+tr.fenv,14000),t);
  flt.frequency.setTargetAtTime(base,t+.005,Math.max(.02,tr.fdec));
  // lfo
  if(tr.lfoRate>0&&tr.lfoDepth>0){
    const lfo=ac.createOscillator(); lfo.frequency.value=tr.lfoRate;
    const lg=ac.createGain(); lfo.connect(lg);
    if(tr.lfoTgt==='pitch'){ lg.gain.value=tr.lfoDepth; oscs.forEach(o=>{ if(o.detune)lg.connect(o.detune); }); }
    else if(tr.lfoTgt==='amp'){ lg.gain.value=tr.lfoDepth/100*tr.vol*vel*.9; lg.connect(out.gain); }
    else { lg.gain.value=tr.lfoDepth*45; lg.connect(flt.frequency); }
    lfo.start(t); lfo.stop(stopAt);
  }
  // amp envelope
  vca.gain.setValueAtTime(0,t);
  vca.gain.linearRampToValueAtTime(1,t+att);
  vca.gain.setTargetAtTime(0,Math.max(t+att,t+dur),rel/3);
  oscs[0].onended=()=>{ try{out.disconnect();}catch(e){} };
  return f;
}
function noiseBurst(t,dur,type,freq,q,gain,tr){
  const nb=ac.createBuffer(1,Math.ceil(ac.sampleRate*(dur+.05)),ac.sampleRate);
  const d=nb.getChannelData(0); for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const src=ac.createBufferSource(); src.buffer=nb;
  const f=ac.createBiquadFilter(); f.type=type; f.frequency.value=freq; f.Q.value=q;
  const g=ac.createGain(); g.gain.setValueAtTime(gain,t); g.gain.setTargetAtTime(0,t,dur/3);
  src.connect(f); f.connect(g); g.connect(master);
  if(tr&&tr.dly>0){ const s=ac.createGain(); s.gain.value=tr.dly; g.connect(s); s.connect(dlyIn); }
  src.start(t); src.stop(t+dur+.05);
  src.onended=()=>{ try{g.disconnect();}catch(e){} };
}
const DRUMS={
 kick(t){ const tr=st.tr.kick, dec=.12+tr.p2*.4;
   const o=ac.createOscillator(); o.type='sine';
   o.frequency.setValueAtTime(160*tr.p1,t); o.frequency.exponentialRampToValueAtTime(42*tr.p1,t+.09);
   const g=ac.createGain(); g.gain.setValueAtTime(tr.vol,t); g.gain.setTargetAtTime(0,t+.005,dec/3);
   o.connect(g); g.connect(master); o.start(t); o.stop(t+dec+.3);
   noiseBurst(t,.012,'highpass',3000,1,tr.vol*.35,tr);
   o.onended=()=>{ try{g.disconnect();}catch(e){} }; },
 clap(t){ const tr=st.tr.clap, dec=.08+tr.p2*.25;
   [0,.012,.024].forEach((off,i)=>noiseBurst(t+off,i<2?.02:dec,'bandpass',1100*tr.p1+400,1.6,tr.vol*(i<2?.5:.8),tr)); },
 hat(t){ const tr=st.tr.hat, dec=.02+tr.p1*.28;
   noiseBurst(t,dec,'highpass',6000*tr.p2,1,tr.vol*.6,tr); },
 perc(t){ const tr=st.tr.perc, dec=.05+tr.p2*.3;
   const o=ac.createOscillator(); o.type='square';
   o.frequency.setValueAtTime(420*tr.p1,t); o.frequency.exponentialRampToValueAtTime(300*tr.p1,t+.05);
   const f=ac.createBiquadFilter(); f.type='bandpass'; f.frequency.value=900*tr.p1; f.Q.value=5;
   const g=ac.createGain(); g.gain.setValueAtTime(tr.vol*.9,t); g.gain.setTargetAtTime(0,t,dec/3);
   o.connect(f); f.connect(g); g.connect(master);
   if(tr.dly>0){ const s=ac.createGain(); s.gain.value=tr.dly; g.connect(s); s.connect(dlyIn); }
   o.start(t); o.stop(t+dec+.2);
   o.onended=()=>{ try{g.disconnect();}catch(e){} }; }
};

/* =============================== sequencer =============================== */
let playing=false, step64=0, nextTime=0, timer=null, lastBassFreq=null;
const uiQ=[], vizQ=[];
function s16(){ return 60/st.bpm/4; }
function barChordDeg(bar){ return progById(st.progId).deg[bar%4]; }
function scheduleStep(step,tBase){
  const s=step%16, bar=(step>>4)%4;
  const t=tBase+(s%2===1?st.swing*s16():0);
  const scale=scaleById(st.scaleId), L=scale.c.length;
  const prog=progById(st.progId), deg=barChordDeg(bar);
  for(const id of ['kick','clap','hat','perc']){
    if(st.tr[id].on[s]){ DRUMS[id](t); vizQ.push({t,kind:id}); }
  }
  { const tr=st.tr.bass, row=tr.steps[s];
    if(row>=0){ const off=tr.follow?scale.c[deg]:0;
      const cents=scaleRowCents(scale,row)+off;
      lastBassFreq=playMel(tr,cents,tr.oct,t,s16()*.92,1,lastBassFreq);
      vizQ.push({t,kind:'note',cents,band:.78}); } }
  { const tr=st.tr.chords, notes=prog.drone?[scale.c[0],700]:chordCents(scale,deg);
    const style=tr.style||'pad';
    if(style==='pad'&&s===0){ notes.forEach(c=>playMel(tr,c,tr.oct,t,s16()*15.5,.85));
      vizQ.push({t,kind:'chord',cents:notes[0],band:.5}); }
    if(style==='stab'&&(s===2||s===6||s===10||s===14)){ notes.forEach(c=>playMel(tr,c,tr.oct,t,s16()*1.6,.8));
      vizQ.push({t,kind:'chord',cents:notes[0],band:.5}); }
    if(style==='arp'){ const seq=[...notes,notes[0]+1200]; const c=seq[s%seq.length];
      playMel(tr,c,tr.oct,t,s16()*.9,.75); vizQ.push({t,kind:'note',cents:c,band:.5}); } }
  { const tr=st.tr.lead, row=tr.steps[s];
    if(row>=0){ const cents=scaleRowCents(scale,row);
      playMel(tr,cents,tr.oct,t,s16()*1.9,1);
      vizQ.push({t,kind:'note',cents,band:.32}); } }
  uiQ.push({t,s,bar});
  if(step===63&&st.evolve){
    const wait=Math.max(0,t-ac.currentTime)*1000+40;
    setTimeout(()=>{ if(!st.evolve)return;
      varyMel(st.tr.lead);
      if(Math.random()<.3)varyMel(st.tr.bass);
      save(); renderAll(); },wait);
  }
}
function tick(){
  while(nextTime<ac.currentTime+.13){
    scheduleStep(step64,nextTime);
    nextTime+=s16(); step64=(step64+1)%64;
  }
}
function togglePlay(){
  ensureAudio();
  playing=!playing;
  const b=document.getElementById('playBtn');
  b.classList.toggle('on',playing);
  b.innerHTML=playing?'&#9632;':'&#9654;';
  if(playing){ step64=0; lastBassFreq=null; nextTime=ac.currentTime+.06; tick(); timer=setInterval(tick,25); }
  else { clearInterval(timer); uiQ.length=0; vizQ.length=0; setPlayhead(-1,-1); }
}


/* =============================== generators =============================== */
const pick=a=>a[Math.floor(Math.random()*a.length)];
function chordPitchClasses(){
  const scale=scaleById(st.scaleId), L=scale.c.length, deg=progById(st.progId).deg[0];
  return [deg,deg+2,deg+4].map(d=>d%L);
}
function genLeadSteps(){
  const scale=scaleById(st.scaleId), L=scale.c.length, maxRow=2*L;
  const ct=chordPitchClasses();
  const steps=Array(16).fill(-1);
  let pos=L+pick([0,1,2]);
  for(let s=0;s<16;s++){
    const strong=s%4===0;
    const density=strong?.85:(s%2===0?.42:.2);
    if(Math.random()>=density)continue;
    if(strong){ // land on the nearest chord tone so strong beats always agree with the harmony
      let best=pos,bd=1e9;
      for(let r=0;r<=maxRow;r++){ if(ct.includes(r%L)){ const d=Math.abs(r-pos)+Math.random()*.9; if(d<bd){bd=d;best=r;} } }
      pos=best;
    } else {
      pos=Math.max(0,Math.min(maxRow,pos+pick([-2,-1,-1,1,1,2])));
    }
    steps[s]=pos;
  }
  if(steps.every(v=>v<0))steps[0]=L;
  return steps;
}
function genBassSteps(){
  const scale=scaleById(st.scaleId), L=scale.c.length;
  let fifth=scale.c.findIndex(c=>c>=650&&c<=750); if(fifth<0)fifth=Math.min(L-1,3);
  const mask=pick([[2,6,10,14],[0,6,10],[0,3,8,11],[2,5,10,13],[0,7,8,14],[0,4,8,12]]);
  const steps=Array(16).fill(-1);
  mask.forEach((s,i)=>{
    const r=Math.random();
    steps[s]=r<.62?0:(r<.82?L:fifth); // mostly roots, some octaves, a few fifths
  });
  return steps;
}
function genDrumSteps(){
  const kick=pick([[0,4,8,12],[0,4,8,12,14],[0,8],[0,6,10],[0,3,8,11]]);
  const clap=pick([[4,12],[4,12],[4,12,15],[]]);
  const hat=pick([[2,6,10,14],[0,2,4,6,8,10,12,14],[2,6,10,14,15],[1,3,5,7,9,11,13,15]]);
  const perc=pick([[3,11],[7,15],[5,13],[3,10,14],[]]);
  st.tr.kick.on=hits(...kick); st.tr.clap.on=hits(...clap);
  st.tr.hat.on=hits(...hat); st.tr.perc.on=hits(...perc);
}
function varyMel(tr){
  const maxRow=2*scaleById(st.scaleId).c.length, L=scaleById(st.scaleId).c.length;
  const idx=[];
  tr.steps.forEach((v,s)=>{ if(v>=0)idx.push(s); });
  if(!idx.length){ tr.steps=genLeadSteps(); return; }
  const n=1+(Math.random()<.5?1:0);
  for(let i=0;i<n;i++){
    const s=pick(idx), op=Math.random();
    if(op<.35) tr.steps[s]=Math.max(0,Math.min(maxRow,tr.steps[s]+pick([-2,-1,1,2])));
    else if(op<.55){ const t2=s+pick([-1,1]); if(t2>=0&&t2<16&&tr.steps[t2]<0){ tr.steps[t2]=tr.steps[s]; tr.steps[s]=-1; } }
    else if(op<.72){ const r=tr.steps[s]; tr.steps[s]=Math.max(0,Math.min(maxRow,r>=L?r-L:r+L)); }
    else if(op<.9){ const t2=(s+2)%16; if(tr.steps[t2]<0)tr.steps[t2]=tr.steps[s]; }
    else if(idx.length>3) tr.steps[s]=-1;
  }
}
/* =============================== UI helpers =============================== */
const $=s=>document.querySelector(s);
function el(tag,cls,html){ const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e; }
function mkSelect(opts,val,onch){
  const s=document.createElement('select');
  opts.forEach(o=>{ const op=document.createElement('option'); op.value=o.v; op.textContent=o.t; s.appendChild(op); });
  s.value=val; s.addEventListener('change',()=>onch(s.value)); return s;
}
function field(label,control){ const f=el('div','field'); const l=el('label',null,label); f.append(l,control); return f; }
function arcPath(cx,cy,r,a0,a1){
  const p=a=>[cx+r*Math.cos(a),cy+r*Math.sin(a)];
  const [x0,y0]=p(a0),[x1,y1]=p(a1);
  return `M ${x0.toFixed(2)} ${y0.toFixed(2)} A ${r} ${r} 0 ${a1-a0>Math.PI?1:0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
}
function mkKnob(o){ // {label,min,max,get,set,fmt,exp,cls}
  const wrap=el('div','knob'+(o.cls?' '+o.cls:'')); wrap.tabIndex=0;
  const A0=Math.PI*.75, A1=Math.PI*2.25, R=16, C=22;
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('width',44); svg.setAttribute('height',40); svg.setAttribute('viewBox','0 0 44 40');
  const track=document.createElementNS('http://www.w3.org/2000/svg','path'); track.setAttribute('class','k-track'); track.setAttribute('d',arcPath(C,20,R,A0,A1));
  const val=document.createElementNS('http://www.w3.org/2000/svg','path'); val.setAttribute('class','k-val');
  const dot=document.createElementNS('http://www.w3.org/2000/svg','circle'); dot.setAttribute('class','k-dot'); dot.setAttribute('r',2.2);
  svg.append(track,val,dot);
  const name=el('div','k-name',o.label), out=el('div','k-out');
  wrap.append(svg,name,out);
  const toNorm=v=>o.exp?Math.log(v/o.min)/Math.log(o.max/o.min):(v-o.min)/(o.max-o.min);
  const fromNorm=n=>o.exp?o.min*Math.pow(o.max/o.min,n):o.min+n*(o.max-o.min);
  function draw(){
    const v=o.get(), n=Math.min(1,Math.max(0,toNorm(v)));
    const a=A0+n*(A1-A0);
    if(n>0.004)val.setAttribute('d',arcPath(C,20,R,A0,a)); else val.setAttribute('d','');
    dot.setAttribute('cx',C+(R-6)*Math.cos(a)); dot.setAttribute('cy',20+(R-6)*Math.sin(a));
    out.textContent=o.fmt?o.fmt(v):v.toFixed(2);
  }
  let startY=null,startN=0;
  wrap.addEventListener('pointerdown',e=>{ wrap.setPointerCapture(e.pointerId); startY=e.clientY; startN=toNorm(o.get()); e.preventDefault(); });
  wrap.addEventListener('pointermove',e=>{ if(startY==null)return;
    const fine=e.shiftKey?.25:1;
    const n=Math.min(1,Math.max(0,startN+(startY-e.clientY)/160*fine));
    o.set(fromNorm(n)); draw(); save(); });
  wrap.addEventListener('pointerup',()=>startY=null);
  wrap.addEventListener('wheel',e=>{ e.preventDefault();
    const n=Math.min(1,Math.max(0,toNorm(o.get())+(e.deltaY<0?.03:-.03)));
    o.set(fromNorm(n)); draw(); save(); },{passive:false});
  wrap.addEventListener('keydown',e=>{ let d=0;
    if(e.key==='ArrowUp'||e.key==='ArrowRight')d=.03; if(e.key==='ArrowDown'||e.key==='ArrowLeft')d=-.03;
    if(d){ e.preventDefault(); const n=Math.min(1,Math.max(0,toNorm(o.get())+d)); o.set(fromNorm(n)); draw(); save(); } });
  draw();
  return wrap;
}
function mkXY(o){ // {labX0,labX1,labY1,getX,getY,set(x,y)}
  const wrap=el('div','xy');
  const dot=el('div','xy-dot');
  wrap.append(dot,el('span','xy-lab l',o.labX0),el('span','xy-lab r',o.labX1),el('span','xy-lab t',o.labY1));
  function place(){ dot.style.left=(o.getX()*100)+'%'; dot.style.top=((1-o.getY())*100)+'%'; }
  function fromEvent(e){
    const r=wrap.getBoundingClientRect();
    o.set(clamp01((e.clientX-r.left)/r.width),clamp01(1-(e.clientY-r.top)/r.height));
    place(); save();
  }
  let held=false;
  wrap.addEventListener('pointerdown',e=>{ wrap.setPointerCapture(e.pointerId); held=true; fromEvent(e); e.preventDefault(); });
  wrap.addEventListener('pointermove',e=>{ if(held)fromEvent(e); });
  wrap.addEventListener('pointerup',()=>{ held=false; if(o.done)o.done(); });
  place();
  return wrap;
}

function buildAround(patchId,curTrack){
  const c=COMPANIONS[patchId]; if(!c)return;
  if(c.scaleId)st.scaleId=c.scaleId;
  if(c.progId)st.progId=c.progId;
  for(const id in (c.tracks||{})){
    if(id===curTrack)continue;
    const spec=c.tracks[id], t=st.tr[id];
    if(spec.patch){
      const keep={steps:t.steps,style:spec.style||t.style,follow:(spec.follow!=null?spec.follow:t.follow),
        oct:(spec.oct!=null?spec.oct:t.oct),vol:t.vol,glide:t.glide};
      Object.assign(t,JSON.parse(JSON.stringify(PATCHES[spec.patch])),keep,{patch:spec.patch});
      macrosFromParams(t);
    } else if(spec.style) t.style=spec.style;
  }
  save(); renderAll();
}

  const N=120; ridge=new Array(N);
  let seed=7;
  const rnd=()=>{ seed=(seed*16807)%2147483647; return seed/2147483647; };
  for(let i=0;i<N;i++){
    const t=i/(N-1);
    ridge[i]= Math.sin(t*9.2)*.35 + Math.sin(t*23+1.7)*.22 + Math.sin(t*51+4)*.12 + (rnd()-.5)*.14;
  }
}
function sizeCanvas(){
  const d=Math.min(devicePixelRatio||1,2);
  W=innerWidth; H=innerHeight; cv.width=W*d; cv.height=H*d; cx2.setTransform(d,0,0,d,0,0);
  horizonY=H*.58;
  skyGrad=cx2.createLinearGradient(0,0,0,horizonY);
  skyGrad.addColorStop(0,'#04050e'); skyGrad.addColorStop(.55,'#0d0a24'); skyGrad.addColorStop(1,'#2a1040');
  vign=cx2.createRadialGradient(W/2,H*.55,H*.3,W/2,H*.55,Math.max(W,H)*.75);
  vign.addColorStop(0,'rgba(0,0,0,0)'); vign.addColorStop(1,'rgba(0,0,0,0.42)');
  scanPat=makeScanPattern();
  stars=Array.from({length:90},()=>({x:Math.random()*W,y:Math.random()*horizonY*.85,r:Math.random()*1.3+.4,ph:Math.random()*7}));
  makeRidge();
}
addEventListener('resize',sizeCanvas); sizeCanvas();

const parts=[];
let kickFlash=0,auroraA=0,auroraHue=200,sunHue=310,sunHueTarget=310,gridT=0,lastFrame=0;
const freqData=new Uint8Array(1024);
function spawn(ev){
  const hue=ev.cents!=null?hueFor(ev.cents):40;
  if(ev.kind==='kick'){ kickFlash=1; parts.push({type:'ripple',r:10,vr:7,a:.55,da:.02}); }
  else if(ev.kind==='clap')parts.push({type:'flash',y:horizonY*.42+Math.random()*horizonY*.2,a:.5,da:.06,hue:330});
  else if(ev.kind==='hat')parts.push({type:'glint',x:Math.random()*W,y:Math.random()*horizonY*.6,r:1.5,a:.9,da:.08,hue:55});
  else if(ev.kind==='perc')parts.push({type:'beam',x:W*.15+Math.random()*W*.7,a:.4,da:.03,hue:20});
  else if(ev.kind==='chord'){ auroraA=Math.min(.8,auroraA+.45); auroraHue=hue; sunHueTarget=hue; }
  else { // melodic note: a comet across the sky, colored by its pitch
    const px=((ev.cents%2400)/2400);
    const dir=px<.5?1:-1;
    parts.push({type:'comet',x:W*.5+(px-.5)*W*.55,y:horizonY*(.35+(ev.band||.4)*.6)-H*.06,
      vx:dir*(1.4+Math.random()*1.6),vy:-.25-Math.random()*.3,a:.95,da:.011,hue,len:26+Math.random()*30});
    sunHueTarget=hue;
  }
  if(parts.length>200)parts.splice(0,parts.length-200);
}
function drawScene(dt){
  // sky
  cx2.globalCompositeOperation='source-over';
  cx2.fillStyle=skyGrad; cx2.fillRect(0,0,W,horizonY+2);
  // stars
  const tNow=performance.now()/1000;
  cx2.fillStyle='#cfd4ee';
  for(const s of stars){
    cx2.globalAlpha=.25+.35*Math.abs(Math.sin(tNow*.7+s.ph));
    cx2.fillRect(s.x,s.y,s.r,s.r);
  }
  cx2.globalAlpha=1;
  // bass energy feeds the sun glow
  let bass=0;
  if(ac&&analyser){ analyser.getByteFrequencyData(freqData);
    for(let i=1;i<9;i++)bass+=freqData[i]; bass/=8*255; }
  sunHue+=(sunHueTarget-sunHue)*Math.min(1,dt*1.4);
  const sr=Math.min(W,H)*.155*(1+bass*.16), sx=W*.5, sy=horizonY-H*.085;
  const glow=cx2.createRadialGradient(sx,sy,sr*.2,sx,sy,sr*3.1);
  glow.addColorStop(0,'hsl('+sunHue+' 90% 62% / '+(0.22+bass*.3)+')');
  glow.addColorStop(1,'hsl('+sunHue+' 90% 50% / 0)');
  cx2.fillStyle=glow; cx2.fillRect(0,0,W,horizonY+2);
  const sg=cx2.createLinearGradient(0,sy-sr,0,sy+sr);
  sg.addColorStop(0,'hsl('+((sunHue+40)%360)+' 95% 72%)');
  sg.addColorStop(1,'hsl('+sunHue+' 90% 52%)');
  cx2.save(); cx2.beginPath(); cx2.arc(sx,sy,sr,0,7); cx2.clip();
  cx2.fillStyle=sg; cx2.fillRect(sx-sr,sy-sr,sr*2,sr*2);
  cx2.fillStyle=skyGrad; // scanline slits across the lower half of the sun
  for(let i=0;i<5;i++){ const yy=sy+sr*(.08+i*.2), hh=sr*(.03+i*.028); cx2.fillRect(sx-sr,yy,sr*2,hh); }
  cx2.restore();
  // aurora band on chords
  if(auroraA>.01){
    const ag=cx2.createLinearGradient(0,horizonY-H*.3,0,horizonY);
    ag.addColorStop(0,'hsl('+auroraHue+' 80% 60% / 0)');
    ag.addColorStop(.6,'hsl('+auroraHue+' 80% 60% / '+(auroraA*.16)+')');
    ag.addColorStop(1,'hsl('+auroraHue+' 80% 60% / 0)');
    cx2.fillStyle=ag; cx2.fillRect(0,horizonY-H*.3,W,H*.3);
    auroraA*=Math.pow(.6,dt);
  }
  // ridge: fractal silhouette lifted by the live spectrum
  const N=ridge.length;
  cx2.beginPath(); cx2.moveTo(0,horizonY+2);
  for(let i=0;i<N;i++){
    const x=i/(N-1)*W;
    let lift=0;
    if(ac){ const bin=8+Math.abs(i-N/2)/(N/2)*70|0; lift=(freqData[bin]||0)/255*H*.045; }
    const y=horizonY-6-(ridge[i]*.5+.5)*H*.075-lift;
    cx2.lineTo(x,y);
  }
  cx2.lineTo(W,horizonY+2); cx2.closePath();
  cx2.fillStyle='#050409'; cx2.fill();
  cx2.strokeStyle='hsl('+((sunHue+180)%360)+' 85% 60% / .55)'; cx2.lineWidth=1.2; cx2.stroke();
  // floor
  const fg=cx2.createLinearGradient(0,horizonY,0,H);
  fg.addColorStop(0,'#12081f'); fg.addColorStop(1,'#05030c');
  cx2.fillStyle=fg; cx2.fillRect(0,horizonY,W,H-horizonY);
  const lineA=.16+kickFlash*.5;
  cx2.strokeStyle='hsl(300 80% 62% / '+lineA+')';
  cx2.lineWidth=1+kickFlash*.8;
  cx2.beginPath();
  for(let i=-11;i<=11;i++){ // verticals converging on the vanishing point
    cx2.moveTo(W/2+i*W*.012,horizonY);
    cx2.lineTo(W/2+i*W*.13,H+20);
  }
  const ROWS=13, f=gridT%1;
  for(let n=0;n<ROWS;n++){ // horizontals rolling toward the viewer
    const t=(n+f)/ROWS, y=horizonY+(H-horizonY)*t*t;
    cx2.moveTo(0,y); cx2.lineTo(W,y);
  }
  cx2.stroke();
  kickFlash*=Math.pow(.02,dt);
}
function drawParts(){
  cx2.globalCompositeOperation='lighter';
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];
    p.a-=p.da; if(p.a<=0){ parts.splice(i,1); continue; }
    if(p.type==='comet'){
      p.x+=p.vx; p.y+=p.vy;
      const g=cx2.createLinearGradient(p.x-p.vx*p.len,p.y-p.vy*p.len,p.x,p.y);
      g.addColorStop(0,'hsl('+p.hue+' 90% 65% / 0)');
      g.addColorStop(1,'hsl('+p.hue+' 90% 70% / '+p.a.toFixed(3)+')');
      cx2.strokeStyle=g; cx2.lineWidth=2;
      cx2.beginPath(); cx2.moveTo(p.x-p.vx*p.len,p.y-p.vy*p.len); cx2.lineTo(p.x,p.y); cx2.stroke();
      cx2.fillStyle='hsl('+p.hue+' 95% 78% / '+p.a.toFixed(3)+')';
      cx2.beginPath(); cx2.arc(p.x,p.y,1.8,0,7); cx2.fill();
    } else if(p.type==='ripple'){
      p.r+=p.vr;
      cx2.strokeStyle='hsl(320 85% 62% / '+p.a.toFixed(3)+')'; cx2.lineWidth=2;
      cx2.beginPath(); cx2.ellipse(W/2,H*.86,p.r*2.4,p.r*.5,0,0,7); cx2.stroke();
    } else if(p.type==='flash'){
      cx2.fillStyle='hsl('+p.hue+' 80% 70% / '+(p.a*.25).toFixed(3)+')';
      cx2.fillRect(0,p.y,W,1.5);
    } else if(p.type==='beam'){
      const g=cx2.createLinearGradient(0,horizonY,0,horizonY-H*.22);
      g.addColorStop(0,'hsl('+p.hue+' 90% 60% / '+(p.a*.5).toFixed(3)+')');
      g.addColorStop(1,'hsl('+p.hue+' 90% 60% / 0)');
      cx2.fillStyle=g; cx2.fillRect(p.x-1.4,horizonY-H*.22,2.8,H*.22);
    } else { // glint
      cx2.fillStyle='hsl('+p.hue+' 90% 80% / '+p.a.toFixed(3)+')';
      cx2.fillRect(p.x-p.r,p.y-p.r,p.r*2,p.r*2);
    }
  }
  cx2.globalCompositeOperation='source-over';
  cx2.fillStyle=scanPat; cx2.fillRect(0,0,W,H);
  cx2.fillStyle=vign; cx2.fillRect(0,0,W,H);
}
function drawViz(ts){
  requestAnimationFrame(drawViz);
  const dt=Math.min(.05,(ts-lastFrame)/1000||.016); lastFrame=ts;
  const now=ac?ac.currentTime:0;
  while(uiQ.length&&uiQ[0].t<=now){ const e=uiQ.shift(); setPlayhead(e.s,e.bar); }
  while(vizQ.length&&vizQ[0].t<=now+.02){ spawn(vizQ.shift()); }
  if(reduceMotion){ drawScene(0); drawParts(); return; }
  gridT+=dt*(playing?st.bpm/60*.9:.25);
  drawScene(dt);
  drawParts();
}
requestAnimationFrame(drawViz);

normalize(st);
renderAll();
</script>
